<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dental Sync 2026 🌸</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap');

    :root {
      /* Пастельная палитра Cute Girl Style */
      --bg-color: #fdf5f6;
      --glass-bg: rgba(255, 255, 255, 0.65);
      --glass-border: rgba(255, 255, 255, 0.8);
      --text-main: #5c4d5d;
      
      --cab-green: #d4f0df;
      --cab-green-active: #95d5b2;
      --cab-blue: #d6e5fa;
      --cab-blue-active: #a1c4fd;
      --cab-orange: #ffe3d4;
      --cab-orange-active: #ffb5a7;

      --btn-inactive: rgba(255, 255, 255, 0.5);
      --btn-active-bg: #fff;
      --accent-red: #ff8fa3;
      --accent-green: #80ed99;
      --shadow: 0 8px 32px rgba(162, 143, 163, 0.15);
      --border-radius: 20px;
    }

    /* Фон с милыми кошачьими лапками (Base64 SVG pattern) */
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Nunito', sans-serif;
      background-color: var(--bg-color);
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M23 18c-3.3 0-6 2.7-6 6s2.7 6 6 6 6-2.7 6-6-2.7-6-6-6zm14 0c-3.3 0-6 2.7-6 6s2.7 6 6 6 6-2.7 6-6-2.7-6-6-6zM15 32c-3.3 0-6 2.7-6 6s2.7 6 6 6 6-2.7 6-6-2.7-6-6-6zm30 0c-3.3 0-6 2.7-6 6s2.7 6 6 6 6-2.7 6-6-2.7-6-6-6zm-15 4c-6.6 0-12 5.4-12 12s5.4 12 12 12 12-5.4 12-12-5.4-12-12-12z' fill='%23f4dae0' fill-opacity='0.4' fill-rule='evenodd'/%3E%3C/svg%3E");
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    h1, h2, h3 { margin: 0; }

    /* Glassmorphism контейнер */
    .app-container {
      width: 100%;
      max-width: 900px;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 2px solid var(--glass-border);
      border-radius: 30px;
      padding: 20px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* --- Блок синхронизации (Sync) --- */
    .sync-panel {
      background: rgba(255, 255, 255, 0.5);
      border-radius: 20px;
      padding: 15px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      border: 1px solid var(--glass-border);
    }
    .sync-input-group {
      display: flex;
      gap: 10px;
      flex: 1;
      min-width: 250px;
    }
    .modern-input {
      flex: 1;
      padding: 10px 15px;
      border-radius: 12px;
      border: 2px solid rgba(255,143,163,0.3);
      background: #fff;
      font-family: inherit;
      color: var(--text-main);
      outline: none;
      transition: 0.3s;
    }
    .modern-input:focus { border-color: var(--accent-red); }
    .sync-btn {
      background: var(--accent-red);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }
    .sync-btn:hover { background: #ff758f; transform: scale(1.05); }
    .status-bar {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* --- Вкладки Кабинетов --- */
    .cab-tabs { display: flex; gap: 10px; }
    .cab-tab {
      flex: 1;
      padding: 15px 5px;
      border: none;
      border-radius: 18px;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      transition: 0.3s;
      background: rgba(255,255,255,0.4);
      color: #8a7c8b;
      position: relative;
      overflow: hidden;
    }
    .cab-tab[data-cab="green"].active { background: var(--cab-green-active); color: #fff; box-shadow: 0 4px 15px rgba(149,213,178,0.4); }
    .cab-tab[data-cab="blue"].active { background: var(--cab-blue-active); color: #fff; box-shadow: 0 4px 15px rgba(161,196,253,0.4); }
    .cab-tab[data-cab="orange"].active { background: var(--cab-orange-active); color: #fff; box-shadow: 0 4px 15px rgba(255,181,167,0.4); }

    /* --- Вкладки Ящиков (Подвкладки) --- */
    .drawer-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
    .drawer-tab {
      flex: 1;
      min-width: 80px;
      padding: 10px;
      border-radius: 12px;
      border: 2px solid transparent;
      background: rgba(255,255,255,0.6);
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
      transition: 0.3s;
      position: relative;
      overflow: hidden;
    }
    .drawer-tab.active {
      background: #fff;
      border-color: var(--accent-red);
      color: var(--accent-red);
      box-shadow: 0 4px 10px rgba(255,143,163,0.2);
    }

    /* --- Стили для долгого нажатия (Прогресс бар сброса) --- */
    .reset-progress {
      position: absolute; top: 0; left: 0; bottom: 0;
      width: 0%;
      background: rgba(255, 143, 163, 0.3);
      z-index: 1;
      pointer-events: none;
    }
    .resetting .reset-progress {
      width: 100%;
      transition: width 1s linear;
    }
    .cab-tab > span, .drawer-tab > span { position: relative; z-index: 2; pointer-events: none; }

    /* --- Сетка материалов --- */
    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
    }

    /* --- Кнопки материалов --- */
    .item-btn {
      background: var(--btn-inactive);
      border: 2px solid var(--glass-border);
      border-radius: 16px;
      padding: 12px 15px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      position: relative;
      overflow: hidden;
      min-height: 60px;
      text-align: left;
    }
    .item-btn:hover { background: rgba(255,255,255,0.8); transform: translateY(-2px); }
    .item-btn.active { background: var(--btn-active-bg); border-color: var(--accent-green); box-shadow: 0 4px 15px rgba(128,237,153,0.3); }
    .item-name { font-weight: 700; font-size: 14px; line-height: 1.2; z-index: 2; flex: 1; pointer-events: none;}
    
    .status-circle {
      width: 16px; height: 16px; min-width: 16px;
      border-radius: 50%;
      background: var(--accent-red);
      transition: 0.3s;
      z-index: 2; pointer-events: none;
    }
    .item-btn.active .status-circle { background: var(--accent-green); box-shadow: 0 0 8px var(--accent-green); }

    /* --- Панели групп --- */
    .panel-group {
      grid-column: 1 / -1;
      border: 2px dashed rgba(255,143,163,0.5);
      border-radius: 20px;
      padding: 15px;
      background: rgba(255,255,255,0.3);
      margin-top: 10px;
    }
    .panel-title { font-weight: 800; color: var(--accent-red); margin-bottom: 12px; font-size: 15px;}
    .panel-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 10px;
    }

    /* --- Инструменты (Чек-листы) --- */
    .tool-card {
      background: rgba(255,255,255,0.7);
      border-radius: 20px;
      padding: 15px;
      border: 1px solid var(--glass-border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .tool-title { font-weight: 800; font-size: 16px; text-align: center; color: var(--text-main); }
    .tool-actions { display: flex; gap: 8px; }
    .tool-action-btn {
      flex: 1;
      padding: 10px 5px;
      border-radius: 12px;
      border: none;
      background: var(--btn-inactive);
      font-family: inherit;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      transition: 0.3s;
      color: #888;
      position: relative;
      overflow: hidden;
    }
    .tool-action-btn.active {
      background: #fff;
      color: var(--accent-green);
      box-shadow: 0 4px 10px rgba(128,237,153,0.3);
    }
    .icon { font-size: 18px; line-height: 1; pointer-events: none;}
  </style>
</head>
<body>

<div class="app-container">
  
  <!-- Панель синхронизации -->
  <div class="sync-panel">
    <div class="sync-input-group">
      <input type="text" id="input-sync-id" class="modern-input" placeholder="Ваш npoint ID (напр. 05c9b...)">
      <button class="sync-btn" onclick="loadFromCloud()">Загрузить</button>
    </div>
    <div id="cloud-status" class="status-bar" style="color: var(--accent-red);">ОЖИДАНИЕ...</div>
  </div>

  <!-- Главные Вкладки Кабинетов -->
  <div class="cab-tabs" id="cabTabs">
    <button class="cab-tab active" data-cab="green" oncontextmenu="return false;">
      <div class="reset-progress"></div><span>Зеленый</span>
    </button>
    <button class="cab-tab" data-cab="blue" oncontextmenu="return false;">
      <div class="reset-progress"></div><span>Синий</span>
    </button>
    <button class="cab-tab" data-cab="orange" oncontextmenu="return false;">
      <div class="reset-progress"></div><span>Оранж</span>
    </button>
  </div>

  <!-- Вкладки Ящиков -->
  <div class="drawer-tabs" id="drawerTabs">
    <button class="drawer-tab active" data-drawer="drawer1" oncontextmenu="return false;">
      <div class="reset-progress"></div><span>Ящик 1</span>
    </button>
    <button class="drawer-tab" data-drawer="drawer2" oncontextmenu="return false;">
      <div class="reset-progress"></div><span>Ящик 2</span>
    </button>
    <button class="drawer-tab" data-drawer="drawer3" oncontextmenu="return false;">
      <div class="reset-progress"></div><span>Ящик 3</span>
    </button>
    <button class="drawer-tab" data-drawer="drawer4" oncontextmenu="return false;">
      <div class="reset-progress"></div><span>Ящик 4</span>
    </button>
    <button class="drawer-tab" data-drawer="tools" oncontextmenu="return false;">
      <div class="reset-progress"></div><span>Инструменты</span>
    </button>
  </div>

  <!-- Контейнер для рендера кнопок -->
  <div id="contentArea"></div>

</div>

<script>
/* =========================================
   СТРУКТУРА ДАННЫХ (Inventory Layout)
========================================= */
const inventoryLayout = {
  drawers: {
    drawer1: {
      items: [
        "Пакуемые материалы A1", "Пакуемые материалы A2", "Пакуемые материалы A3", "Пакуемые материалы A3.5",
        "Жидкотекучие материалы A2", "Жидкотекучие материалы A3", "Увлажняющий материал (смола)",
        "Жидкий коффердам", "Кальцийсодержащая прокладка", "Бонд", "Травильный гель", "Фторлак",
        "Витамин E", "Ретракционные нити 00", "Ретракционные нити 000", "Маленький блокнот для замешивания",
        "Флосс", "Насадка на ультразвук", "Защитный экран для лампы", "Лампа", "Кариес-маркер",
        "Jen-DuaCem (двойной цемент)", "Метрогил/Метровиол", "Полировочная паста", "Браши",
        "Копирка и пинцет для копирки", "Временная пломба", "Полировочные штрипсы",
        "5 насадок для двойного цемента", "Лавсановые (прозрачные) матрицы",
        "Металлические матрицы", "Металлические кольца для матриц", "Металлические полировочные штрипсы"
      ],
      panels: {
        "Полировочные диски": ["5 синих", "5 зелёных", "5 белых", "5 жёлтых"],
        "Клинья": ["зелёные", "синие", "жёлтые", "фиолетовые"]
      }
    },
    drawer2: {
      items: [
        "5 эндолинеек", "Эндомотор", "Апекслокатор", "3 клинстенда", "4 загубника", "4 эндобокса",
        "6 пар эндоигл", "5 спонжей для клинстенда", "Нож для гуттаперчи", "4 насадки для ножа",
        "Тефлон", "Adseal", "Девит", "Кальций", "Пульпоэкстракторы", "Вата", "Гваяфен", "Йодоформ",
        "Дексодент", "Бумажные пины конусности 04 и 06", "Гуттаперча конусности 04 и 06", "10 шприцов для промывания"
      ]
    },
    drawer3: {
      items: [
        "Канюли для шприцов", "3 набора развёрток", "Крампоны", "Карпульный шприц", "5 инсулиновых шприцов",
        "Перекись водорода 3%", "Хлоргексидин 0,05%", "Спирт",
        "OptraGate S — 5 шт.", "OptraGate R — 5 шт.", "Длинные карпульные иглы — 10 шт.",
        "Короткие карпульные иглы — 10 шт.", "СХ (постоянный цемент) — 1 шт.", "Средний блокнот",
        "Гемостатики ViscoStat и Немоха", "Септанест 1:100 000 — 10 шт.", "Септанест 1:200 000 — 10 шт.",
        "Скандонест — 10 шт.", "Tempolat C — 1 шт.", "Жабки — 3 шт."
      ],
      panels: {
        "Шприцы": ["2 шт. по 2 мл", "2 шт. по 5 мл", "2 шт. по 10 мл"]
      }
    },
    drawer4: {
      items: [
        "Боксы с борами", "Насадки на ультразвук", "Неотложная медицина"
      ],
      panels: {
        "Растворы": ["гипохлорит 5,25%", "лимонная кислота", "хлоргексидин 2%"],
        "Пылесосы": ["5 белых", "5 зелёных", "5 синих", "2 больших белых"]
      }
    }
  },
  tools: {
    green: ["лампа", "эндомотор", "нож для гутаперчи", "лампа для отбеливания"],
    blue: ["лампа", "эндомотор", "нож для гутаперчи", "апекслокатор", "рентген", "ультразвук", "аирфлоу", "что-то еще"],
    orange: ["лампа", "эндомотр", "нож для гутаперчи", "сканер", "инфузомат"]
  }
};

/* =========================================
   СОСТОЯНИЕ ПРИЛОЖЕНИЯ (State Management)
========================================= */
let activeCab = 'green';
let activeDrawer = 'drawer1';
const CABS = ['green', 'blue', 'orange'];
const DRAWERS = ['drawer1', 'drawer2', 'drawer3', 'drawer4', 'tools'];

// Инициализация пустого состояния на основе layout
function buildInitialState() {
  let s = {};
  CABS.forEach(cab => {
    s[cab] = {};
    DRAWERS.forEach(dr => {
      s[cab][dr] = {};
      if (dr === 'tools') {
        inventoryLayout.tools[cab].forEach(tool => {
          s[cab][dr][tool] = { charge: false, clean: false };
          if (tool.toLowerCase() === 'аирфлоу') s[cab][dr][tool].blow = false;
        });
      } else {
        inventoryLayout.drawers[dr].items.forEach(item => s[cab][dr][item] = false);
        if (inventoryLayout.drawers[dr].panels) {
          Object.values(inventoryLayout.drawers[dr].panels).forEach(arr => {
            arr.forEach(item => s[cab][dr][item] = false);
          });
        }
      }
    });
  });
  return s;
}

let appData = {
  syncId: "",
  data: buildInitialState()
};

/* =========================================
   СИНХРОНИЗАЦИЯ: npoint.io + localStorage
========================================= */
let isCloudSynced = false;
let isInitializing = true;
let autoSaveTimeout = null;
const apiBase = "https://api.npoint.io/";

function updateStatus(text, color) {
  const el = document.getElementById('cloud-status');
  el.textContent = text;
  el.style.color = color;
}

function saveLocal() {
  appData.syncId = document.getElementById('input-sync-id').value.trim();
  localStorage.setItem('dental_clinic_2026', JSON.stringify(appData));
}

async function loadFromCloud() {
  const id = document.getElementById('input-sync-id').value.trim();
  if (!id) return;
  
  isInitializing = true;
  updateStatus("ЗАГРУЗКА...", "var(--text-main)");
  
  try {
    const res = await fetch(`${apiBase}${id}?t=${Date.now()}`);
    if (res.ok) {
      const serverData = await res.json();
      if(serverData && serverData.data) {
        appData.data = serverData.data;
      }
      isCloudSynced = true;
      saveLocal();
      renderContent();
      updateStatus("СИНХРОНИЗИРОВАНО", "var(--accent-green)");
    } else {
      updateStatus("ОШИБКА ID", "var(--accent-red)");
    }
  } catch(e) {
    updateStatus("ОШИБКА СЕТИ", "var(--accent-red)");
  }
  isInitializing = false;
}

async function performAutoSave() {
  if (isInitializing) return;
  saveLocal();
  if (!isCloudSynced || !appData.syncId) return;
  
  updateStatus("СОХРАНЕНИЕ...", "#f59e0b");
  try {
    const res = await fetch(apiBase + appData.syncId, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(appData)
    });
    if (res.ok) updateStatus("СИНХРОНИЗИРОВАНО", "var(--accent-green)");
    else throw new Error();
  } catch(e) {
    updateStatus("ОШИБКА. ПОВТОР...", "var(--accent-red)");
    setTimeout(performAutoSave, 2000);
  }
}

function triggerAutoSave() {
  saveLocal();
  clearTimeout(autoSaveTimeout);
  autoSaveTimeout = setTimeout(performAutoSave, 1000);
}

/* =========================================
   РЕНДЕР И ЛОГИКА ИНТЕРФЕЙСА
========================================= */

function toggleItem(item) {
  appData.data[activeCab][activeDrawer][item] = !appData.data[activeCab][activeDrawer][item];
  renderContent();
  triggerAutoSave();
}

function toggleToolAction(tool, action) {
  appData.data[activeCab]['tools'][tool][action] = !appData.data[activeCab]['tools'][tool][action];
  renderContent();
  triggerAutoSave();
}

function renderContent() {
  const container = document.getElementById('contentArea');
  container.innerHTML = '';
  
  if (activeDrawer === 'tools') {
    const toolsGrid = document.createElement('div');
    toolsGrid.className = 'items-grid';
    
    inventoryLayout.tools[activeCab].forEach(tool => {
      const card = document.createElement('div');
      card.className = 'tool-card';
      
      const title = document.createElement('div');
      title.className = 'tool-title';
      title.innerText = tool.charAt(0).toUpperCase() + tool.slice(1);
      
      const actionsData = [
        { key: 'charge', label: 'Зарядка' },
        { key: 'clean', label: 'Чистка' }
      ];
      if (tool.toLowerCase() === 'аирфлоу') {
        actionsData.push({ key: 'blow', label: 'Продувка' });
      }

      const actionsDiv = document.createElement('div');
      actionsDiv.className = 'tool-actions';
      
      actionsData.forEach(act => {
        const btn = document.createElement('button');
        const isActive = appData.data[activeCab]['tools'][tool][act.key];
        btn.className = `tool-action-btn ${isActive ? 'active' : ''}`;
        
        btn.innerHTML = `<span class="icon">${isActive ? '✅' : '❌'}</span><span>${act.label}</span>`;
        btn.onclick = () => toggleToolAction(tool, act.key);
        setupLongPress(btn, () => {
          if(appData.data[activeCab]['tools'][tool][act.key]) {
             appData.data[activeCab]['tools'][tool][act.key] = false;
             renderContent(); triggerAutoSave();
          }
        });
        actionsDiv.appendChild(btn);
      });
      
      card.appendChild(title);
      card.appendChild(actionsDiv);
      toolsGrid.appendChild(card);
    });
    container.appendChild(toolsGrid);

  } else {
    const layout = inventoryLayout.drawers[activeDrawer];
    const grid = document.createElement('div');
    grid.className = 'items-grid';

    layout.items.forEach(item => {
      grid.appendChild(createItemBtn(item));
    });

    if (layout.panels) {
      Object.keys(layout.panels).forEach(panelName => {
        const panel = document.createElement('div');
        panel.className = 'panel-group';
        panel.innerHTML = `<div class="panel-title">${panelName}</div>`;
        
        const pGrid = document.createElement('div');
        pGrid.className = 'panel-grid';
        layout.panels[panelName].forEach(item => {
          pGrid.appendChild(createItemBtn(item));
        });
        panel.appendChild(pGrid);
        grid.appendChild(panel);
      });
    }
    container.appendChild(grid);
  }
}

function createItemBtn(item) {
  const btn = document.createElement('button');
  const isActive = appData.data[activeCab][activeDrawer][item];
  btn.className = `item-btn ${isActive ? 'active' : ''}`;
  btn.innerHTML = `
    <div class="reset-progress"></div>
    <div class="status-circle"></div>
    <span class="item-name">${item}</span>
  `;
  
  btn.onclick = (e) => {
    if (btn.dataset.longpressed) { btn.removeAttribute('data-longpressed'); return; }
    toggleItem(item);
  };
  
  setupLongPress(btn, () => {
    if(appData.data[activeCab][activeDrawer][item]) {
      appData.data[activeCab][activeDrawer][item] = false;
      renderContent(); triggerAutoSave();
    }
  });

  return btn;
}

/* =========================================
   ЛОГИКА ДОЛГОГО НАЖАТИЯ (Long Press)
========================================= */
function setupLongPress(element, callback) {
  let pressTimer;
  const startPress = (e) => {
    if(e.type === 'mousedown' && e.button !== 0) return;
    element.classList.add('resetting');
    pressTimer = setTimeout(() => {
      element.classList.remove('resetting');
      element.dataset.longpressed = "true";
      callback();
      if(window.navigator && window.navigator.vibrate) navigator.vibrate(50);
    }, 1000);
  };
  
  const cancelPress = () => {
    clearTimeout(pressTimer);
    element.classList.remove('resetting');
  };

  element.addEventListener('mousedown', startPress);
  element.addEventListener('touchstart', startPress, {passive: true});
  element.addEventListener('mouseup', cancelPress);
  element.addEventListener('mouseleave', cancelPress);
  element.addEventListener('touchend', cancelPress);
}

// Привязка вкладок и их сброс
document.querySelectorAll('.cab-tab').forEach(tab => {
  tab.addEventListener('click', (e) => {
    if (tab.dataset.longpressed) { tab.removeAttribute('data-longpressed'); return; }
    document.querySelectorAll('.cab-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    activeCab = tab.dataset.cab;
    renderContent();
  });
  
  setupLongPress(tab, () => {
    DRAWERS.forEach(dr => {
      for(let key in appData.data[tab.dataset.cab][dr]) {
        if (dr === 'tools') {
          for(let act in appData.data[tab.dataset.cab][dr][key]) appData.data[tab.dataset.cab][dr][key][act] = false;
        } else {
          appData.data[tab.dataset.cab][dr][key] = false;
        }
      }
    });
    renderContent(); triggerAutoSave();
  });
});

document.querySelectorAll('.drawer-tab').forEach(tab => {
  tab.addEventListener('click', (e) => {
    if (tab.dataset.longpressed) { tab.removeAttribute('data-longpressed'); return; }
    document.querySelectorAll('.drawer-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    activeDrawer = tab.dataset.drawer;
    renderContent();
  });

  setupLongPress(tab, () => {
    const dr = tab.dataset.drawer;
    for(let key in appData.data[activeCab][dr]) {
        if (dr === 'tools') {
          for(let act in appData.data[activeCab][dr][key]) appData.data[activeCab][dr][key][act] = false;
        } else {
          appData.data[activeCab][dr][key] = false;
        }
    }
    renderContent(); triggerAutoSave();
  });
});

/* =========================================
   ЗАГРУЗКА ПРИЛОЖЕНИЯ (Init)
========================================= */
window.onload = async () => {
  const saved = localStorage.getItem('dental_clinic_2026');
  if (saved) {
    try {
      const parsed = JSON.parse(saved);
      appData.syncId = parsed.syncId || "";
      document.getElementById('input-sync-id').value = appData.syncId;
      
      if (parsed.data) {
         CABS.forEach(cab => {
            DRAWERS.forEach(dr => {
               if(parsed.data[cab] && parsed.data[cab][dr]) {
                  if (dr === 'tools') {
                     for(let tool in appData.data[cab][dr]) {
                        if(parsed.data[cab][dr][tool]) {
                           Object.assign(appData.data[cab][dr][tool], parsed.data[cab][dr][tool]);
                        }
                     }
                  } else {
                     for(let item in appData.data[cab][dr]) {
                        if(parsed.data[cab][dr][item] !== undefined) {
                           appData.data[cab][dr][item] = parsed.data[cab][dr][item];
                        }
                     }
                  }
               }
            })
         });
      }
      
      renderContent();
      
      if (appData.syncId) {
        await loadFromCloud();
      } else {
        isInitializing = false;
        updateStatus("ЛОКАЛЬНЫЙ РЕЖИМ", "#888");
      }
    } catch (e) {
      console.error("Ошибка чтения localStorage", e);
      isInitializing = false;
      renderContent();
    }
  } else {
    isInitializing = false;
    renderContent();
    updateStatus("ЛОКАЛЬНЫЙ РЕЖИМ", "#888");
  }
};
</script>
